<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="230" fill="none">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d19"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0e1526"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Card -->
  <rect x="20" y="20" width="840" height="190" rx="14" fill="#0284c7" fill-opacity="0.1" filter="url(#soft-glow)"/>

  <!-- Card Body -->
  <rect x="1" y="1" width="878" height="228" rx="12" fill="url(#card-bg)" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect x="1" y="1" width="878" height="38" rx="12" fill="#161b22" fill-opacity="0.75"/>
  <line x1="1" y1="39" x2="879" y2="39" stroke="#30363d" stroke-width="1"/>

  <!-- macOS Control Buttons -->
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="440" y="24" text-anchor="middle" fill="#8b949e" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1">
    ari@nexus: ~/core-profile.sh
  </text>

  <!-- Status Indicator -->
  <g transform="translate(810, 20)">
    <circle cx="-10" cy="0" r="4" fill="#10b981"/>
    <circle cx="-10" cy="0" r="7" fill="#10b981" fill-opacity="0.25"/>
    <text x="2" y="3.5" fill="#34d399" font-family="'Fira Code', Consolas, monospace" font-size="11" font-weight="600">online</text>
  </g>

  <!-- Terminal Content Lines -->
  <!-- Line 1: Role -->
  <g transform="translate(32, 70)">
    <text x="0" y="0" fill="#38bdf8" font-family="'Fira Code', Consolas, monospace" font-size="13" font-weight="700">❯ role</text>
    <text x="130" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">
      AI &amp; Data Engineer
    </text>
  </g>

  <!-- Line 2: Education -->
  <g transform="translate(32, 102)">
    <text x="0" y="0" fill="#38bdf8" font-family="'Fira Code', Consolas, monospace" font-size="13" font-weight="700">❯ education</text>
    <text x="130" y="0" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
      M.Sc. Professional Computer Science (Big Data) <tspan fill="#64748b">@</tspan> Simon Fraser University
    </text>
  </g>

  <!-- Line 3: Focus -->
  <g transform="translate(32, 134)">
    <text x="0" y="0" fill="#38bdf8" font-family="'Fira Code', Consolas, monospace" font-size="13" font-weight="700">❯ focus</text>
    <text x="130" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
      Autonomous Agent Gateways (MCP) <tspan fill="#38bdf8">•</tspan> Distributed Lakehouses <tspan fill="#38bdf8">•</tspan> Real-Time ML Systems
    </text>
  </g>

  <!-- Line 4: Credentials (Pills) -->
  <g transform="translate(32, 168)">
    <text x="0" y="11" fill="#38bdf8" font-family="'Fira Code', Consolas, monospace" font-size="13" font-weight="700">❯ creds</text>
    
    <!-- AWS Pill -->
    <g transform="translate(130, -2)">
      <rect x="0" y="0" width="280" height="24" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="14" cy="12" r="3.5" fill="#f59e0b"/>
      <text x="26" y="16" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">AWS Certified ML Engineer – Associate</text>
    </g>

    <!-- Publications Pill -->
    <g transform="translate(420, -2)">
      <rect x="0" y="0" width="260" height="24" rx="6" fill="#171523" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="14" cy="12" r="3.5" fill="#818cf8"/>
      <text x="26" y="16" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">3x Peer-Reviewed Author (IEEE / Elsevier)</text>
    </g>
  </g>

  <!-- Line 5: Status -->
  <g transform="translate(32, 206)">
    <text x="0" y="0" fill="#38bdf8" font-family="'Fira Code', Consolas, monospace" font-size="13" font-weight="700">❯ status</text>
    <text x="130" y="0" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      Available for AI &amp; Data Engineering Co-op &amp; Full-Time Roles
    </text>
  </g>
</svg>
